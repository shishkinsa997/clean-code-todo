<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
    >
  </head>
  <body>
    <header class="about">
      <img class="about__img" src="./eisenhower-matrix.jpg" alt="eisenhower-matrix">
      <a
        class="about__info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >Want more details?
      </a>
    </header>
    <main class="main-page-wrapper">
      <section id="add-task">
        <h1 for="new-task">Add Item</h1>
        <div class="add-task__wrapper">
          <input
            id="new-task"
            class="add-task__input"
            type="text"
          >
          <button>Add</button>
        </div>
      </section>
      <section>
        <h2>Todo</h2>
        <ul id="incompleted-tasks">
          <li>
            <input type="checkbox">
            <label class="task">Pay Bills</label>
            <input type="text" class="input-task">
            <button class="btn-edit">Edit</button>
            <button class="btn-delete">
              <img class="btn-delete__img" src="./remove.svg" alt="remove-button">
            </button>
          </li>
          <li class="edit-mode">
            <input type="checkbox">
            <label class="task">Go Shopping</label>
            <input
              type="text"
              value="Go Shopping"
              class="input-task"
            >
            <button class="btn-edit">Save</button>
            <button class="btn-delete">
              <img class="btn-delete__img" src="./remove.svg" alt="remove-button">
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2>Completed</h2>
        <ul id="completed-tasks">
          <li class="completed">
            <input
              type="checkbox"
              checked
            >
            <label class="task">See the Doctor</label>
            <input
              type="text"
              class="input-task"
            >
            <button class="btn-edit">Edit</button>
            <button class="btn-delete">
              <img class="btn-delete__img" src="./remove.svg" alt="remove-button">
            </button>
          </li>
        </ul>
      </section>
    </main>
  <script src="script.js"></script>
  </body>
</html>
